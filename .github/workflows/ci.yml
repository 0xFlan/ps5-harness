name: ci

on:
  push:
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Set up Node for the browser runtime test
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Plugin example
        run: make plugin-example

      - name: Plugin ABI smoke test
        run: ./build/harness --tools --plugins examples/plugins/hello
